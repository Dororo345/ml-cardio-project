name: CardioPrognoz V3 acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  v3-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: CardioPrognoz_V3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: CardioPrognoz_V3/requirements.txt
      - name: Install V3 dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app.py accounts.py integration.py mock_medical_service.py tests
      - name: Test V3 application and real local mock
        run: python -m pytest -q --junitxml=test-results/v3.xml
      - name: Preserve V3 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardio-v3-python-${{ matrix.python-version }}
          path: CardioPrognoz_V3/test-results/v3.xml
          if-no-files-found: error
