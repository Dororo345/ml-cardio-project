name: CI - CardioPrognoz
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q app.py validation.py xai.py tests scripts/lz9
      - name: Run tests
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install UI test dependencies
        run: npm ci
      - name: Test form DOM behavior
        run: npm test
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: error
